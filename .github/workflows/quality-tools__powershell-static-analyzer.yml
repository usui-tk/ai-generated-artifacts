# ============================================================================
# CI workflow for quality-tools/powershell-static-analyzer/
# psa.py self-quality gates (Pillar 1, 2, 3).
#
# Pillar definitions are authoritative in psa.py SPEC.md §12 and in the
# psa.py source comment block headed "Self-quality-gate facilities":
#   Pillar 1 (Rule self-tests):       python3 test_psa_rules.py
#   Pillar 2 (Config schema check):   psa.py --config-check <path>
#   Pillar 3 (SPEC drift detection):  psa.py --self-check
#
# Governance policies (design principles, naming, timeout tiers, Fork PR
# handling, etc.) are defined in the repository-level specification:
#   /SPEC.md
#
# Change history for this workflow is recorded in:
#   quality-tools/powershell-static-analyzer/CHANGELOG.md
#
# Every run step executes under `shell: bash` (set once in `defaults.run`),
# which GitHub runs as `bash --noprofile --norc -eo pipefail {0}`. The
# pipefail is load-bearing: each pillar pipes into `tee`, and without it the
# step's status is tee's (always 0), so a failing pillar would pass silently.
# See /SPEC.md §2.5 [SPEC-CI-005] (quality gates MUST be blocking).
#
# Do NOT add per-workflow CHANGELOG.md, README.md, or governance docs under
# .github/workflows/. See /SPEC.md §9 [SPEC-CI-070].
# ============================================================================
name: 'quality-tools/powershell-static-analyzer — psa.py CI'

on:
  push:
    branches: [main]
    paths:
      - 'quality-tools/powershell-static-analyzer/psa.py'
      - 'quality-tools/powershell-static-analyzer/VERSION'
      - 'quality-tools/powershell-static-analyzer/test_psa_rules.py'
      - 'quality-tools/powershell-static-analyzer/SPEC.md'
      - 'quality-tools/powershell-static-analyzer/.psa.config.json.template'
      - '.github/workflows/quality-tools__powershell-static-analyzer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'quality-tools/powershell-static-analyzer/psa.py'
      - 'quality-tools/powershell-static-analyzer/VERSION'
      - 'quality-tools/powershell-static-analyzer/test_psa_rules.py'
      - 'quality-tools/powershell-static-analyzer/SPEC.md'
      - 'quality-tools/powershell-static-analyzer/.psa.config.json.template'
      - '.github/workflows/quality-tools__powershell-static-analyzer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psa-py-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psa-py-self-check:
    # Fork PR guard: see /SPEC.md §5 [SPEC-CI-030]. Same-repo PRs and
    # push/dispatch always proceed; fork-origin PRs are skipped.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30  # T1 — Light (see /SPEC.md §4 [SPEC-CI-020])
    defaults:
      run:
        # bash => -eo pipefail (see the header): a failing pillar piped
        # into tee must fail the step. Do not remove.
        shell: bash
        working-directory: quality-tools/powershell-static-analyzer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # Pin to 3.12 (matches Stage 1 rationale). The psa.py self-test
          # suite (test_psa_rules.py) has not been validated against the
          # CPython 3.14 series that '3.x' currently resolves to.
          python-version: '3.12'

      # --- Pre-flight: runner environment diagnostics ---
      # Mirrors the diagnostic step in the update-windows-server-iso
      # workflows; records runner version, Python version, CWD up front
      # so failed runs carry the data needed to triage runner-side drift.
      - name: '[Diag] Runner environment snapshot'
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          echo "===== uname ====="
          uname -a
          echo
          echo "===== Python ====="
          python3 --version
          which python3
          echo
          echo "===== Current working directory (default per `defaults.run`) ====="
          pwd
          echo
          echo "===== Repository top-level layout ====="
          ls -la "$GITHUB_WORKSPACE" | head -10

      - name: '[sanity] Python syntax check'
        # Quick fail-fast before running heavier gates. py_compile catches
        # parse-level errors that would otherwise surface as confusing
        # tracebacks deep in the self-test suite or the analyzer pipeline.
        run: python3 -m py_compile psa.py test_psa_rules.py

      - name: '[Pillar 1] Rule self-tests (python3 test_psa_rules.py)'
        # Every rule in RULES with positive / negative / edge fixtures.
        # The suite is stdlib-only and is its own runner (SPEC.md §12.1:
        # "just python3 test_psa_rules.py"); it exits 1 on any failure.
        # It is NOT pytest-collectable (0 tests collected), so a pytest
        # invocation here would run nothing.
        run: python3 test_psa_rules.py 2>&1 | tee pillar1.log

      - name: '[Pillar 2] Config schema validation (psa.py --config-check)'
        # Validates the shipped .psa.config.json.template against the
        # documented schema (psa.py SPEC.md §5 / §12.2).
        run: python3 psa.py --config-check .psa.config.json.template | tee pillar2.log

      - name: '[Pillar 3] SPEC drift detection (psa.py --self-check)'
        # Compares SPEC.md §4 rule headings against the runtime RULES table
        # (psa.py SPEC.md §12.3). Exits non-zero on any drift.
        run: python3 psa.py --self-check | tee pillar3.log

      - name: '[Summary] Write Step Summary'
        if: always()
        run: |
          {
            echo "## psa.py — Self-quality gates"
            echo ""
            echo "Three pillars (per psa.py SPEC.md §12) were exercised on the working tree."
            echo ""
            echo "### Pillar 1 — Rule self-tests (\`python3 test_psa_rules.py\`)"
            if [ -f pillar1.log ]; then
              tail -20 pillar1.log
            fi
            echo ""
            echo "### Pillar 2 — Config schema validation (\`psa.py --config-check\`)"
            if [ -f pillar2.log ]; then
              cat pillar2.log
            fi
            echo ""
            echo "### Pillar 3 — SPEC drift detection (\`psa.py --self-check\`)"
            if [ -f pillar3.log ]; then
              cat pillar3.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: '[Artifacts] Upload logs'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psa-py-${{ github.run_id }}
          path: |
            quality-tools/powershell-static-analyzer/pillar1.log
            quality-tools/powershell-static-analyzer/pillar2.log
            quality-tools/powershell-static-analyzer/pillar3.log
          if-no-files-found: warn
          retention-days: 14
