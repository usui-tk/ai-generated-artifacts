# ============================================================================
# CI workflow for projects/powershell-update-windows-server-iso/
# STAGE 1 - Linux contract suite (tier 1 of TESTING.md section 5)
#
# STAGE 1 is the regression net. It runs the project's whole
# offline-deterministic tier -- every contract in tests/ -- on every push
# and every pull request. The tier is the authority for what runs here:
# when TESTING.md section 5 gains or loses a tier-1 contract, this
# workflow follows automatically, because the suite is invoked by glob
# rather than by an enumerated list of test names.
#
# STAGE 1 no longer triggers STAGE 2. STAGE 2 is triggered directly by
# push and pull_request so that Windows evidence is available BEFORE a
# merge, and so that STAGE 2 can qualify as a required status check
# (a workflow_run-triggered workflow cannot -- /SPEC.md section 6).
#
# PSScriptAnalyzer is run inline (Install-Module + Invoke-ScriptAnalyzer
# + ConvertTo-SARIF) rather than via the unmaintained Marketplace action
# microsoft/psscriptanalyzer-action. See CHANGELOG.md "r07.0 Step 11"
# for the migration rationale.
#
# Governance: /SPEC.md
# Change history: projects/powershell-update-windows-server-iso/CHANGELOG.md
# ============================================================================
name: 'projects/powershell-update-windows-server-iso — STAGE 1: Linux contract suite'

on:
  # No path filter, deliberately. The suite is the regression net for
  # every artifact in the project -- the two deliverables, the declared
  # data and schema surfaces, the contracts themselves, the analyzer
  # baseline and the documentation the contracts read. A path list is a
  # second, hand-maintained model of that dependency graph, and the one
  # this workflow carried had already drifted: a change confined to
  # tests/, schema/ or the Collector never triggered it.
  #
  # Running unconditionally also makes STAGE 1 eligible as a required
  # status check without deadlocking documentation-only pull requests,
  # which is the failure mode a path-filtered required check produces
  # (the check never reports, so the PR can never satisfy it).
  #
  # Affordable by measurement: the offline suite is ~2 minutes.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which tool group to run (default: all)'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'psa-only', 'pssa-only']

permissions:
  contents: read
  security-events: write  # for upload-sarif

concurrency:
  group: uwsi-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-checks:
    # Fork PR guard: see /SPEC.md §5 [SPEC-CI-030]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # T2 - Medium baseline (see /SPEC.md §4 [SPEC-CI-020]). Measured
    # budget: PSGallery install 2-3 min, offline contract suite ~2 min,
    # PSScriptAnalyzer over the 27k-line deliverable 5-10 min. The
    # previous 90-minute extension predates those measurements and is
    # dropped, which also removes the extension-rationale requirement.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # Pin to 3.12 (LTS Python) rather than '3.x' which resolves to
          # the latest available CPython. As of mid-2026 setup-python
          # resolves '3.x' to 3.14.x which has not been validated against
          # psa.py + the T1-T5 self-verification tools. Bump explicitly
          # after running the full test matrix locally on the target
          # Python version.
          python-version: '3.12'

      # --- Pre-flight: runner environment diagnostics ---
      # The ubuntu-latest image is rolled weekly. Recording the Python
      # version, pwsh availability, CWD, and key env vars up front means
      # every failed run carries the data needed to triage runner-side
      # drift without having to re-run the job for diagnosis. Mirrors
      # the Windows-side diagnostic step in STAGE 2.
      - name: '[Diag] Runner environment snapshot'
        run: |
          set +e   # don't let a single missing tool tank the diagnostic step
          echo "===== uname ====="
          uname -a
          echo
          echo "===== Python ====="
          python3 --version
          which python3
          echo
          echo "===== pwsh (PowerShell 7) ====="
          if command -v pwsh > /dev/null 2>&1; then
            pwsh --version
            which pwsh
          else
            echo "pwsh NOT FOUND on this runner"
          fi
          echo
          echo "===== Current working directory ====="
          pwd
          echo
          echo "===== Key environment variables ====="
          for v in GITHUB_WORKSPACE RUNNER_TEMP RUNNER_OS RUNNER_ARCH HOME TMPDIR; do
            echo "  $v = ${!v}"
          done
          echo
          echo "===== Repository top-level layout ====="
          ls -la "$GITHUB_WORKSPACE" | head -20

      # --- Source-file format guard: BOM + CRLF + literal-scoped ASCII ---
      # The contract is SPEC §A.2: UTF-8 BOM, CRLF, and non-ASCII
      # confined to intentional data/string literals. An earlier inline
      # version of this step rejected ANY byte above 0x7F, which is
      # stricter than SPEC and rejects the ja-jp Catalog display-name
      # aliases the script legitimately carries. The check now lives
      # once, in tests/source_format_test.py (T54), where the PowerShell
      # parser classifies each occurrence -- same rule as the 2026-07-02
      # audit C1 lesson recorded on the schema step below: validation
      # logic lives in tests/, never inlined here.
      - name: '[Format] Source-file format contract (T54)'
        working-directory: projects/powershell-update-windows-server-iso
        run: python3 tests/source_format_test.py

      # --- Tool group: config schema conformance ---
      # Validates data/config-Server*.json against schema/config.schema.json
      # (the machine-readable mirror of SPEC B.4). This test is the SINGLE
      # config-validation authority in CI: an earlier inline duplicate of this
      # logic hardcoded Schema 2.0/2.1 and failed every run after the v3.0
      # data-source migration while this correct gate sat right below it
      # (2026-07-02 audit C1). Validation logic must live once, in
      # tests/config_schema_test.py + the schema file -- never inlined here.
      - name: '[Schema] Validate config against JSON Schema (SPEC B.4)'
        working-directory: projects/powershell-update-windows-server-iso
        run: python3 tests/config_schema_test.py

      # --- Tool group: the offline contract suite ---
      # Every `*_test.py` in tests/ plus the Part C format gate. These
      # are the contracts TESTING §0 inventories; they are all offline
      # and deterministic, and several drive pwsh (present on the
      # ubuntu-latest image and already required by the PSScriptAnalyzer
      # steps below). Until this step existed, Stage 1 ran exactly one
      # of them, so the declaration-derived and behavioural contracts --
      # including every Collector contract -- were invisible to CI and
      # only ever ran in the local gate battery.
      #
      # No test is named individually here on purpose: the glob makes a
      # newly added contract run without a workflow edit, which is the
      # failure mode that let the inventory drift in the first place.
      - name: '[Suite] Offline contract suite'
        working-directory: projects/powershell-update-windows-server-iso/tests
        run: |
          set -o pipefail
          rc=0
          for t in *_test.py canonical_json_format_check.py; do
            echo "===== $t ====="
            if python3 "$t"; then
              echo "----- $t: rc=0"
            else
              echo "----- $t: rc=$? FAILED"
              rc=1
            fi
          done
          exit $rc

      # --- Tool group: psa.py ---
      # NOTE: psa.py auto-loads .psa.config.json from CWD (implicit config).
      # Running from the project directory enables the psa2010_known_cmdlets
      # list documented in the project-level .psa.config.json. Do not refactor
      # to run from repo root without explicitly passing --config.
      # Reporting only. psa.py exits non-zero whenever it reports any
      # finding, so treating its exit code as the gate is a strict-zero
      # gate by construction. This project runs under the adjudicated-
      # debt governance (TESTING §0): the gate is the declared baseline
      # in `.psa-baseline.json`, asserted by tests/psa_debt_baseline_test.py
      # (T55) inside the suite step above, which fails on any increase
      # AND on a stale (over-stated) declaration. Do not reintroduce
      # exit-code gating here.
      - name: '[psa.py] Run text analysis (report only; the gate is T55)'
        if: ${{ inputs.scope == 'all' || inputs.scope == 'psa-only' || github.event_name != 'workflow_dispatch' }}
        working-directory: projects/powershell-update-windows-server-iso
        run: |
          set +e
          # Both deliverables report into the single `psa.log` basename.
          # /SPEC.md §12.2 allowlists artifact basenames, and adding a
          # new one would require amending that repository-wide policy
          # in this change set; sectioning one file avoids that while
          # still surfacing the Collector.
          {
            echo '===== Update-WindowsServerIso.ps1 ====='
          } > psa.log
          python3 ../../quality-tools/powershell-static-analyzer/psa.py Update-WindowsServerIso.ps1 >> psa.log 2>&1
          echo "psa.py (main) exit code: $? (findings are expected; T55 is the gate)"
          {
            echo
            echo '===== Collect-WindowsServerPostInstallEvidence.ps1 ====='
          } >> psa.log
          python3 ../../quality-tools/powershell-static-analyzer/psa.py Collect-WindowsServerPostInstallEvidence.ps1 >> psa.log 2>&1
          echo "psa.py (collector) exit code: $?"
          cat psa.log
          exit 0

      - name: '[psa.py] Generate SARIF'
        if: ${{ inputs.scope == 'all' || inputs.scope == 'psa-only' || github.event_name != 'workflow_dispatch' }}
        working-directory: projects/powershell-update-windows-server-iso
        run: |
          set +e
          python3 ../../quality-tools/powershell-static-analyzer/psa.py --format sarif Update-WindowsServerIso.ps1 > psa.sarif
          rc=$?
          echo "psa.py --format sarif exit code: $rc (non-zero on findings; expected)"
          if [ ! -s psa.sarif ]; then
            echo 'FAIL: psa.sarif was not produced' >&2
            exit 1
          fi

      - name: '[psa.py] Upload SARIF to Code Scanning'
        if: ${{ always() && (inputs.scope == 'all' || inputs.scope == 'psa-only' || github.event_name != 'workflow_dispatch') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: projects/powershell-update-windows-server-iso/psa.sarif
          category: psa-py

      # --- Tool group: PSScriptAnalyzer (PowerShell 7.x, inline) ---
      # We invoke PSScriptAnalyzer inline rather than through the
      # microsoft/psscriptanalyzer-action Marketplace action because that
      # action's Install-Module ConvertToSARIF step is a known flaky
      # dependency on PSGallery (observed failing intermittently even on
      # Microsoft's own CI). Inlining lets us add TLS 1.2 enforcement,
      # NuGet provider preflight, PSGallery trust, and exponential-backoff
      # retry around each install, eliminating the third-party action
      # while preserving the same pssa.sarif output for the downstream
      # github/codeql-action/upload-sarif@v4 step.
      - name: '[PSSA-pwsh7] Install PowerShell modules (PSScriptAnalyzer + ConvertToSARIF)'
        if: ${{ inputs.scope == 'all' || inputs.scope == 'pssa-only' || github.event_name != 'workflow_dispatch' }}
        id: pssa-linux-install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor `
              [Net.SecurityProtocolType]::Tls12

          Write-Host '===== NuGet provider preflight ====='
          $needNuget = $true
          try {
              $nuget = Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue
              if ($nuget -and $nuget.Version -ge [Version]'2.8.5.201') { $needNuget = $false }
          } catch { }
          if ($needNuget) {
              try {
                  Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 `
                      -Force -Scope CurrentUser | Out-Null
              } catch {
                  Write-Warning "  NuGet provider install failed (non-fatal on Linux pwsh 7): $($_.Exception.Message)"
              }
          }
          try {
              $nv = (Get-PackageProvider -Name NuGet).Version
              Write-Host "  NuGet provider: $nv"
          } catch {
              Write-Host '  NuGet provider: (not available; relying on PowerShellGet built-in)'
          }

          Write-Host '===== PSGallery preflight ====='
          try {
              $repo = Get-PSRepository -Name PSGallery -ErrorAction Stop
              if ($repo.InstallationPolicy -ne 'Trusted') {
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              }
          } catch {
              Register-PSRepository -Default
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          Get-PSRepository | Format-Table -AutoSize | Out-String | Write-Host

          function Install-ModuleWithRetry {
              param([Parameter(Mandatory)][string]$Name, [int]$MaxAttempts = 3)
              if (Get-Module -ListAvailable -Name $Name) {
                  Write-Host "  ${Name}: already installed"
                  return
              }
              for ($i = 1; $i -le $MaxAttempts; $i++) {
                  try {
                      Install-Module -Name $Name -Force -Scope CurrentUser `
                          -Repository PSGallery -AllowClobber -ErrorAction Stop
                      Write-Host "  ${Name}: installed (attempt $i/$MaxAttempts)"
                      return
                  } catch {
                      $msg = $_.Exception.Message
                      Write-Warning ("  {0}: install attempt {1}/{2} failed: {3}" -f $Name, $i, $MaxAttempts, $msg)
                      if ($i -eq $MaxAttempts) { throw }
                      Start-Sleep -Seconds ([Math]::Pow(2, $i))
                  }
              }
          }

          Write-Host '===== PSScriptAnalyzer install ====='
          Install-ModuleWithRetry -Name PSScriptAnalyzer

          Write-Host '===== ConvertToSARIF install ====='
          Install-ModuleWithRetry -Name ConvertToSARIF

          Import-Module -Name ConvertToSARIF -Force
          Write-Host '===== Installed modules ====='
          Get-Module -ListAvailable PSScriptAnalyzer, ConvertToSARIF |
              Sort-Object Name, Version |
              Format-Table Name, Version, Path -AutoSize |
              Out-String | Write-Host

      - name: '[PSSA-pwsh7] Run PSScriptAnalyzer + ConvertToSARIF'
        if: ${{ inputs.scope == 'all' || inputs.scope == 'pssa-only' || github.event_name != 'workflow_dispatch' }}
        id: pssa-linux
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module -Name ConvertToSARIF -Force

          $scriptPath   = './projects/powershell-update-windows-server-iso/Update-WindowsServerIso.ps1'
          $settingsPath = './projects/powershell-update-windows-server-iso/PSScriptAnalyzerSettings.psd1'

          Invoke-ScriptAnalyzer -Path $scriptPath -Settings $settingsPath |
              ConvertTo-SARIF -FilePath ./pssa.sarif

          if (-not (Test-Path ./pssa.sarif)) {
              Write-Error 'pssa.sarif was not produced'
              exit 1
          }
          $sz = (Get-Item ./pssa.sarif).Length
          Write-Host ("Wrote pssa.sarif ({0:N0} bytes)" -f $sz)

      - name: '[PSSA-pwsh7] Upload SARIF to Code Scanning'
        if: ${{ always() && (inputs.scope == 'all' || inputs.scope == 'pssa-only' || github.event_name != 'workflow_dispatch') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pssa.sarif
          category: pssa-pwsh7

      - name: '[PSSA-pwsh7] Generate text log from SARIF (for artifact)'
        if: ${{ always() && (inputs.scope == 'all' || inputs.scope == 'pssa-only' || github.event_name != 'workflow_dispatch') }}
        shell: pwsh
        run: |
          if (Test-Path pssa.sarif) {
            $sarif = Get-Content pssa.sarif -Raw | ConvertFrom-Json
            $results = $sarif.runs[0].results
            "PSScriptAnalyzer (pwsh 7) results: $($results.Count) finding(s)" | Out-File pssa.log
            foreach ($r in $results) {
              "[$($r.level)] $($r.ruleId) : $($r.message.text) @ $($r.locations[0].physicalLocation.region.startLine)" | Out-File pssa.log -Append
            }
            Get-Content pssa.log
          } else {
            "pssa.sarif not produced - see action log for failure." | Out-File pssa.log
          }

      # --- Common: Step Summary and artifacts ---
      - name: '[Summary] Write Step Summary'
        if: always()
        run: |
          {
            echo "## STAGE 1 - Linux checks results"
            echo ""
            echo "### psa.py (both deliverables; sectioned)"
            if [ -f projects/powershell-update-windows-server-iso/psa.log ]; then
              tail -40 projects/powershell-update-windows-server-iso/psa.log
            fi
            echo ""
            echo "### PSScriptAnalyzer (pwsh 7)"
            if [ -f pssa.log ]; then
              cat pssa.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact content minimization: see /SPEC.md §12 [SPEC-CI-081].
      # The path list below MUST be an explicit file enumeration drawn
      # from the allowlist in /SPEC.md §12.2 (psa.log, psa.sarif,
      # pssa.log, pssa.sarif). Wildcard paths (e.g., 'path: .',
      # 'path: ./**') are forbidden - they would upload the entire
      # checkout including hidden files and potentially secrets.
      - name: '[Artifacts] Upload logs'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uwsi-stage1-${{ github.run_id }}
          path: |
            projects/powershell-update-windows-server-iso/psa.log
            projects/powershell-update-windows-server-iso/psa.sarif
            pssa.log
            pssa.sarif
          if-no-files-found: warn
          retention-days: 14
