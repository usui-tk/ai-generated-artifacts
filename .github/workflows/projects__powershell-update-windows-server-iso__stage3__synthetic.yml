# ============================================================================
# CI workflow for projects/powershell-update-windows-server-iso/
# STAGE 3 - Windows synthetic full pipeline (ADK install +
# -SyntheticTestMode -Execute end-to-end).
#
# Manual dispatch ONLY. It previously also ran on release/published
# with no tag filter, which meant publishing a GitHub Release for ANY
# sub-project in this monorepo started this 240-minute Windows job --
# including releases that have nothing to do with this project. That
# was an accident of trigger design, not a decision.
#
# It is also not a per-commit gate. The run depends on a real ADK
# install, real DISM and real oscdimg, so its failures are frequently
# environmental rather than regressions. Per-commit regression cover is
# STAGE 1; per-commit Windows evidence is STAGE 2.
#
# KNOWN DEFECT (2026-08-08, measured): the synthetic pipeline cannot
# currently complete P04. Under -SyntheticTestMode the phase writes the
# resolved-patch evidence manifest, whose writer requires a local
# SHA-256 for every non-metadata patch -- payloads that synthetic mode
# never downloads, and that P02 explicitly declares are not required.
# Until that contradiction is resolved in the script, a dispatch of
# this workflow is expected to fail in P04. The defect is recorded in
# CHANGELOG and TESTING; the workflow is kept, unweakened, so that the
# fix can be verified here when it lands.
#
# Performs an end-to-end pipeline run (P01 through P13) in
# -SyntheticTestMode, exercising DISM mount, Add-WindowsPackage
# (against a stub WIM), and oscdimg (against a stub bootable layout)
# without touching any real Microsoft binary. This verifies the
# integration of the DISM + oscdimg toolchain on a clean ADK install
# in a way that cannot be done from Linux.
#
# CRITICAL: This workflow MUST NOT upload the produced ISO as an
# artifact. The Microsoft Software Licence Terms for evaluation
# binaries forbid public distribution. The -SyntheticTestMode pipeline
# itself produces no Microsoft content, but we keep the no-upload
# guarantee in place to prevent a future regression from accidentally
# leaking evaluation content via CI artifacts.
#
# Governance: /SPEC.md
# Change history: projects/powershell-update-windows-server-iso/CHANGELOG.md
# ============================================================================
name: 'projects/powershell-update-windows-server-iso — STAGE 3: Synthetic full pipeline (manual)'

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (e.g., "Re-validate after dependency change")'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: uwsi-stage3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-synthetic:
    # Fork PR guard: kept for consistency (release/dispatch events do not
    # come from fork PRs, so this is formally always true here).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    # T3 - Heavy: 240 minutes (policy maximum, see /SPEC.md §4 [SPEC-CI-020])
    # Rationale: ADK installer download (~1 GB, ~5 min), ADK install
    # (~10 min), full -SyntheticTestMode pipeline including DISM
    # mount + oscdimg (~5 min), plus buffer for transient network
    # latency on the ADK download.
    timeout-minutes: 240
    # Defaults follow the github-actions Windows PowerShell guidance:
    # explicit working-directory anchored at the checkout root prevents
    # surprises from runner-side CWD differences.
    defaults:
      run:
        shell: powershell
        working-directory: ${{ github.workspace }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      # --- Pre-flight: runner environment diagnostics ---
      # The windows-latest image is rolled weekly. Recording PS version,
      # encoding, execution policy, identity, and CWD up front means every
      # failed run carries the data needed to triage runner-side drift.
      - name: '[Diag] Runner environment snapshot'
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding             = [System.Text.Encoding]::UTF8

          Write-Host '===== PSVersionTable ====='
          $PSVersionTable | Format-List | Out-String | Write-Host

          Write-Host '===== ExecutionPolicy (all scopes) ====='
          Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host '===== Console encoding ====='
          Write-Host ("Console.OutputEncoding : {0}" -f [Console]::OutputEncoding.WebName)

          Write-Host '===== Identity ====='
          whoami
          Write-Host ("IsAdmin: {0}" -f ([Security.Principal.WindowsPrincipal] `
              [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator))

          Write-Host '===== Disk space (free GB on C:) ====='
          $vol = Get-Volume -DriveLetter C
          Write-Host ("  C: free = {0:N1} GB / total = {1:N1} GB ({2})" -f `
              ($vol.SizeRemaining / 1GB), ($vol.Size / 1GB), $vol.FileSystem)

          Write-Host '===== Key environment variables ====='
          'GITHUB_WORKSPACE','RUNNER_TEMP','RUNNER_OS','RUNNER_ARCH','TEMP','TMP' | ForEach-Object {
              $val = [Environment]::GetEnvironmentVariable($_)
              Write-Host ("  {0,-20} = {1}" -f $_, $val)
          }

      # --- Cache the ADK installer to avoid re-downloading ~1 GB ---
      - name: '[ADK] Cache installer'
        id: adk-cache
        uses: actions/cache@v5
        with:
          path: C:\AdkCache
          key: adk-deploy-2024-v1

      - name: '[ADK] Download Windows ADK installer (offline cache miss)'
        if: steps.adk-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          New-Item -ItemType Directory -Path 'C:\AdkCache' -Force | Out-Null
          # ADK 10.1.26100.1 (Windows 11 24H2 ADK)
          $url = 'https://go.microsoft.com/fwlink/?linkid=2271337'
          Invoke-WebRequest -Uri $url -OutFile 'C:\AdkCache\adksetup.exe' -UseBasicParsing

      - name: '[ADK] Install Deployment Tools (offline)'
        shell: powershell
        run: |
          $proc = Start-Process -FilePath 'C:\AdkCache\adksetup.exe' `
              -ArgumentList '/quiet','/installpath','C:\ADK','/features','OptionId.DeploymentTools' `
              -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
              Write-Error ("ADK installer returned exit code $($proc.ExitCode)")
              exit 1
          }
          # Confirm oscdimg.exe is present in one of the documented locations
          $candidates = @(
              'C:\ADK\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe',
              'C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe',
              'C:\Program Files\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe'
          )
          $found = $false
          foreach ($c in $candidates) {
              if (Test-Path -LiteralPath $c) {
                  Write-Host ("oscdimg.exe found: $c")
                  $found = $true; break
              }
          }
          if (-not $found) {
              Write-Error 'oscdimg.exe not found after ADK install.'
              exit 1
          }

      # --- Full -SyntheticTestMode pipeline ---
      # -SyntheticTestMode skips the Catalog refresh and the
      # patch-servicing validation phases (the wsusscn2.cab scan that
      # once backed the latter was retired with the migration to the
      # Microsoft Update Catalog). This keeps
      # Stage 3 self-contained: no Catalog connectivity and no patch
      # downloads. Real-world dependency validation is exercised in
      # production runs, not in CI.
      - name: '[Synthetic] Run Update-WindowsServerIso.ps1 in -SyntheticTestMode (full)'
        shell: powershell
        timeout-minutes: 60
        working-directory: projects/powershell-update-windows-server-iso
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # Sandbox + Synthetic: exercises the full path including DISM
          # mount, Add-WindowsPackage simulation, oscdimg, P11 verify, P12 PCA2023 readiness.
          .\Update-WindowsServerIso.ps1 `
              -Action PrepareBuildVerify `
              -OsVersion Server2019 -OsLanguage en-us `
              -SyntheticTestMode `
              -SkipEnvCheck `
              -WorkRoot 'C:\Temp\Workspace_UpdateWsi_CI' `
              -Execute
          if ($LASTEXITCODE -ne 0) {
              Write-Error ("Synthetic full pipeline exited $LASTEXITCODE")
              exit $LASTEXITCODE
          }

      - name: '[Synthetic] Sanity-check that an output ISO exists (DO NOT upload)'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $outDir = 'C:\Temp\Workspace_UpdateWsi_CI\output'
          $isos = Get-ChildItem -LiteralPath $outDir -Filter '*.iso' -ErrorAction SilentlyContinue
          if (-not $isos) {
              Write-Error ("No output ISO found under $outDir")
              exit 1
          }
          foreach ($i in $isos) {
              Write-Host ("Output ISO (NOT uploaded): $($i.FullName) ($($i.Length) bytes)")
          }

      - name: '[Summary] Write Step Summary'
        if: always()
        shell: powershell
        run: |
          "## STAGE 3 - Synthetic full pipeline results" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Full P01-P13 execution under -SyntheticTestMode -Execute." >> $env:GITHUB_STEP_SUMMARY
          "Output ISO produced but NOT uploaded (evaluation licence)." >> $env:GITHUB_STEP_SUMMARY
          "See the job log for the complete phase-by-phase output." >> $env:GITHUB_STEP_SUMMARY

      # Artifact content minimization: see /SPEC.md §12 [SPEC-CI-081].
      # Logs and diagnostic data ONLY - never the output ISO itself.
      # The exclude rule below is belt-and-braces against a future
      # regression where the path glob accidentally grows to cover
      # the output/ folder.
      # Artifact upload intentionally removed. The previous form used
      # wildcard paths (`logs\**`, `diag\**`), which /SPEC.md §12.4
      # forbids outright, and the files it collected -- per-invocation
      # transcripts with generated names, debugtrace.jsonl, phase CSVs
      # -- are not on the §12.2 allowlist and cannot be enumerated
      # without a wildcard because their names carry timestamps.
      #
      # Removing the step is the only option that conforms without
      # amending a repository-wide policy from inside this project's
      # change set. It costs little here: this workflow is manual-only,
      # so an operator is present, and the full diagnostic output
      # remains in the job log and the Step Summary above.
      #
      # Revisit if /SPEC.md §12.2 is amended to admit a per-project
      # diagnostic allowlist (registered as a central-reflux candidate
      # together with the STAGE 4 artifact question).
