# ============================================================================
# CI workflow for projects/powershell-update-windows-server-iso/
# STAGE 2 - Windows checks (PSScriptAnalyzer on Windows PowerShell 5.1 +
# read-only smoke modes including -EnvironmentInfoOnly and -Action ListPhases).
#
# Triggered by STAGE 1 success (workflow_run chain, 1 hop).
# PSScriptAnalyzer is run inline (Install-Module + Invoke-ScriptAnalyzer
# + ConvertTo-SARIF) on the windows-latest runner rather than via the
# unmaintained Marketplace action microsoft/psscriptanalyzer-action.
# See CHANGELOG.md "r07.0 Step 11" for the migration rationale.
#
# Governance: /SPEC.md
# Change history: projects/powershell-update-windows-server-iso/CHANGELOG.md
# ============================================================================
name: 'projects/powershell-update-windows-server-iso - STAGE 2: Windows checks'

on:
  workflow_run:
    workflows: ['projects/powershell-update-windows-server-iso - STAGE 1: Linux checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read  # to read upstream workflow_run status

concurrency:
  group: uwsi-stage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    # Run only on STAGE 1 success; Fork PR guard kept for consistency
    # (workflow_run does not fire on fork PR HEAD by default, but we keep
    # the guard to enforce the project-wide invariant from /SPEC.md §5).
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    # T2 - Medium (extended): 120 minutes (see /SPEC.md §4 [SPEC-CI-020])
    # Rationale: Windows runner cold-start is slower (~2 min); PSScriptAnalyzer
    # install on Windows PowerShell 5.1 is slower than on pwsh 7 Linux
    # (~5-8 min); -EnvironmentInfoOnly + -Action ListPhases smoke tests
    # (~1 min combined) plus buffer for transient PSGallery latency.
    timeout-minutes: 120
    # Defaults follow the github-actions Windows PowerShell guidance:
    # explicit working-directory anchored at the checkout root prevents
    # surprises from runner-side CWD differences (Linux vs Windows, hosted
    # runner image updates, etc.) and explicit shell selection makes the
    # PS 5.1 vs pwsh 7 distinction obvious at the step level.
    defaults:
      run:
        shell: powershell
        working-directory: ${{ github.workspace }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6

      # --- Pre-flight: runner environment diagnostics ---
      # The GitHub-hosted windows-latest image is rolled weekly and is not
      # a fixed environment. Recording the PS version, encoding, execution
      # policy, identity, and CWD up front means every failed run carries
      # the data needed to triage runner-side drift without having to
      # re-run the job for diagnosis. Per the github-actions Windows
      # PowerShell guidance (and standard Windows-runner triage practice).
      - name: '[Diag] Runner environment snapshot'
        run: |
          $ErrorActionPreference = 'Continue'
          # Force UTF-8 console output - PS 5.1's default is the legacy ANSI
          # code page (cp1252 on en-US hosts), which mangles non-ASCII text
          # in $GITHUB_OUTPUT / $GITHUB_ENV / log capture. UTF-8 is what every
          # consumer of these streams expects.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding             = [System.Text.Encoding]::UTF8

          Write-Host '===== PSVersionTable ====='
          $PSVersionTable | Format-List | Out-String | Write-Host

          Write-Host '===== Current location ====='
          Get-Location | Write-Host

          Write-Host '===== ExecutionPolicy (all scopes) ====='
          Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host '===== Console encoding ====='
          Write-Host ("Console.OutputEncoding : {0}" -f [Console]::OutputEncoding.WebName)
          Write-Host ("`$OutputEncoding         : {0}" -f $OutputEncoding.WebName)

          Write-Host '===== Identity ====='
          whoami
          Write-Host ("IsAdmin: {0}" -f ([Security.Principal.WindowsPrincipal] `
              [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator))

          Write-Host '===== Key environment variables ====='
          'GITHUB_WORKSPACE','RUNNER_TEMP','RUNNER_OS','RUNNER_ARCH','TEMP','TMP' | ForEach-Object {
              $val = [Environment]::GetEnvironmentVariable($_)
              Write-Host ("  {0,-20} = {1}" -f $_, $val)
          }

          Write-Host '===== ADK / oscdimg presence (informational) ====='
          $oscdimgCandidates = @(
              'C:\Program Files\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe',
              'C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe'
          )
          foreach ($c in $oscdimgCandidates) {
              $exists = Test-Path -LiteralPath $c
              Write-Host ("  {0} : {1}" -f $(if ($exists) { 'FOUND   ' } else { 'NOT FOUND' }), $c)
          }

      # --- Tool group: PSScriptAnalyzer (Windows PowerShell 5.1) ---
      # We invoke PSScriptAnalyzer inline rather than through the
      # microsoft/psscriptanalyzer-action Marketplace action because that
      # action's Install-Module ConvertToSARIF step is a known flaky
      # dependency on PSGallery: Microsoft's own CI of the action has
      # been observed failing intermittently, and a fresh windows-latest
      # runner sometimes lacks a current NuGet provider / trusted
      # PSGallery policy. Inlining the four real commands (install,
      # import, analyze, convert) lets us add TLS 1.2 enforcement, NuGet
      # provider preflight, PSGallery trust, and exponential-backoff
      # retry around each install, eliminating the third-party dependency
      # while preserving the same pssa.sarif output for the downstream
      # github/codeql-action/upload-sarif@v4 step.
      - name: '[PSSA-pwsh51] Install PowerShell modules (PSScriptAnalyzer + ConvertToSARIF)'
        id: pssa-windows-install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Force TLS 1.2 explicitly. Some windows-latest images start with
          # a SecurityProtocol value that excludes Tls12, which makes the
          # PSGallery handshake fail before the package search can run.
          [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor `
              [Net.SecurityProtocolType]::Tls12

          Write-Host '===== NuGet provider preflight ====='
          $needNuget = $true
          try {
              $nuget = Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue
              if ($nuget -and $nuget.Version -ge [Version]'2.8.5.201') { $needNuget = $false }
          } catch { }
          if ($needNuget) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 `
                  -Force -Scope CurrentUser | Out-Null
          }
          $nv = (Get-PackageProvider -Name NuGet).Version
          Write-Host "  NuGet provider: $nv"

          Write-Host '===== PSGallery preflight ====='
          # On the windows-latest = Windows Server 2025 image, PSGallery is not
          # pre-registered for Windows PowerShell 5.1, and `Register-PSRepository
          # -Default` fails against the image's bundled NuGet provider (observed:
          # "NuGet.Commands.CommandException: Missing option value for: '-source'"),
          # which then left PSGallery unregistered and aborted the job. Register the
          # source explicitly instead, with a PackageManagement-layer fallback;
          # neither path goes through the failing -Default bootstrap.
          $gallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if (-not $gallery) {
              $registered = $false
              try {
                  Register-PSRepository -Name PSGallery `
                      -SourceLocation 'https://www.powershellgallery.com/api/v2' `
                      -PublishLocation 'https://www.powershellgallery.com/api/v2/package/' `
                      -InstallationPolicy Trusted -ErrorAction Stop
                  $registered = $true
              } catch {
                  Write-Warning "  explicit Register-PSRepository failed: $($_.Exception.Message)"
              }
              if (-not $registered) {
                  Register-PackageSource -Name PSGallery `
                      -Location 'https://www.powershellgallery.com/api/v2' `
                      -ProviderName PowerShellGet -Trusted -Force -ErrorAction Stop | Out-Null
              }
          }
          if ((Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue).InstallationPolicy -ne 'Trusted') {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          }
          Get-PSRepository | Format-Table -AutoSize | Out-String | Write-Host

          function Install-ModuleWithRetry {
              param([Parameter(Mandatory)][string]$Name, [int]$MaxAttempts = 3)
              if (Get-Module -ListAvailable -Name $Name) {
                  Write-Host "  ${Name}: already installed"
                  return
              }
              for ($i = 1; $i -le $MaxAttempts; $i++) {
                  try {
                      Install-Module -Name $Name -Force -Scope CurrentUser `
                          -Repository PSGallery -AllowClobber -ErrorAction Stop
                      Write-Host "  ${Name}: installed (attempt $i/$MaxAttempts)"
                      return
                  } catch {
                      $msg = $_.Exception.Message
                      Write-Warning ("  {0}: install attempt {1}/{2} failed: {3}" -f $Name, $i, $MaxAttempts, $msg)
                      if ($i -eq $MaxAttempts) { throw }
                      Start-Sleep -Seconds ([Math]::Pow(2, $i))
                  }
              }
          }

          Write-Host '===== PSScriptAnalyzer install ====='
          Install-ModuleWithRetry -Name PSScriptAnalyzer

          Write-Host '===== ConvertToSARIF install ====='
          Install-ModuleWithRetry -Name ConvertToSARIF

          Import-Module -Name ConvertToSARIF -Force
          Write-Host '===== Installed modules ====='
          Get-Module -ListAvailable PSScriptAnalyzer, ConvertToSARIF |
              Sort-Object Name, Version |
              Format-Table Name, Version, Path -AutoSize |
              Out-String | Write-Host

      - name: '[PSSA-pwsh51] Run PSScriptAnalyzer + ConvertToSARIF'
        id: pssa-windows
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module -Name ConvertToSARIF -Force

          $scriptPath   = './projects/powershell-update-windows-server-iso/Update-WindowsServerIso.ps1'
          $settingsPath = './projects/powershell-update-windows-server-iso/PSScriptAnalyzerSettings.psd1'

          Invoke-ScriptAnalyzer -Path $scriptPath -Settings $settingsPath |
              ConvertTo-SARIF -FilePath ./pssa.sarif

          if (-not (Test-Path ./pssa.sarif)) {
              Write-Error 'pssa.sarif was not produced'
              exit 1
          }
          $sz = (Get-Item ./pssa.sarif).Length
          Write-Host ("Wrote pssa.sarif ({0:N0} bytes)" -f $sz)

      - name: '[PSSA-pwsh51] Upload SARIF to Code Scanning'
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pssa.sarif
          category: pssa-pwsh51

      - name: '[PSSA-pwsh51] Generate text log from SARIF (for artifact)'
        if: always()
        shell: pwsh
        run: |
          if (Test-Path pssa.sarif) {
            $sarif = Get-Content pssa.sarif -Raw | ConvertFrom-Json
            $results = $sarif.runs[0].results
            "PSScriptAnalyzer (Windows PS 5.1) results: $($results.Count) finding(s)" | Out-File pssa.log
            foreach ($r in $results) {
              "[$($r.level)] $($r.ruleId) : $($r.message.text) @ $($r.locations[0].physicalLocation.region.startLine)" | Out-File pssa.log -Append
            }
            Get-Content pssa.log
          } else {
            "pssa.sarif not produced - see action log for failure." | Out-File pssa.log
          }

      # --- Parse-only check (Windows PowerShell 5.1) ---
      # Confirms the AST parses cleanly under the target runtime. Many
      # PS 7-only syntactic constructs (ternary, ?., ?:) would fail here
      # but not on Linux pwsh 7.
      - name: '[Parse-pwsh51] AST parse-only check'
        shell: powershell
        working-directory: projects/powershell-update-windows-server-iso
        run: |
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\Update-WindowsServerIso.ps1).Path,
              [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
              $errors | Format-Table -AutoSize
              Write-Error ("Parser found $($errors.Count) error(s) under Windows PowerShell 5.1")
              exit 1
          }
          Write-Host ("Parser OK: $($tokens.Count) tokens, no errors.")

      # --- Smoke test 1: -Action ListPhases (no side effects) ---
      - name: '[Smoke1] -Action ListPhases'
        shell: powershell
        timeout-minutes: 2
        working-directory: projects/powershell-update-windows-server-iso
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          .\Update-WindowsServerIso.ps1 -Action ListPhases
          if ($LASTEXITCODE -ne 0) {
              Write-Error "ListPhases smoke test failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      # --- Smoke test 2: -EnvironmentInfoOnly ---
      # Dumps PowerShell runtime info via Show-PowerShellEnvironment and exits 0.
      # Matches the canonical Phase 1 Step 0 smoke pattern used across this repo.
      - name: '[Smoke2] -EnvironmentInfoOnly'
        shell: powershell
        timeout-minutes: 5
        working-directory: projects/powershell-update-windows-server-iso
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          .\Update-WindowsServerIso.ps1 -EnvironmentInfoOnly -WorkRoot 'C:\Temp\Workspace_UpdateWsi_CI'
          if ($LASTEXITCODE -ne 0) {
              Write-Error "EnvironmentInfoOnly smoke test failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      # --- Smoke test 3: Synthetic + DryRun (no DISM writes, no Catalog) ---
      # Exercises the registry-driven dispatcher and the P02/P04/P05
      # planning paths without mounting any WIM. -SyntheticTestMode also
      # implicitly skips P03 (Catalog scrape) and P06 (wsusscn2 scan)
      # in r05.0+ phase numbering (was P02.5/P04.5 in r04.x).
      - name: '[Smoke3] Synthetic + DryRun'
        shell: powershell
        timeout-minutes: 5
        working-directory: projects/powershell-update-windows-server-iso
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          .\Update-WindowsServerIso.ps1 `
              -Action PrepareBuildVerify `
              -OsVersion Server2019 -OsLanguage en-us `
              -SyntheticTestMode -DryRun -SkipEnvCheck `
              -WorkRoot 'C:\Temp\Workspace_UpdateWsi_CI'
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Synthetic+DryRun smoke test failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: '[Summary] Write Step Summary'
        if: always()
        shell: pwsh
        run: |
          "## STAGE 2 - Windows checks results" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "### PSScriptAnalyzer (Windows PS 5.1)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path pssa.log) { Get-Content pssa.log | Out-File $env:GITHUB_STEP_SUMMARY -Append }
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "### Smoke tests" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- ListPhases: see job log" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- EnvironmentInfoOnly: see job log" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Synthetic + DryRun: see job log" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # Artifact content minimization: see /SPEC.md §12 [SPEC-CI-081].
      # The path list below MUST be an explicit file enumeration drawn
      # from the allowlist in /SPEC.md §12.2 (pssa.log, pssa.sarif).
      # Wildcard paths (e.g., 'path: .', 'path: ./**') are forbidden -
      # they would upload the entire checkout including hidden files
      # and potentially secrets.
      - name: '[Artifacts] Upload logs'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uwsi-stage2-${{ github.run_id }}
          path: |
            pssa.log
            pssa.sarif
          if-no-files-found: warn
          retention-days: 14
