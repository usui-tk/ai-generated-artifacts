# ============================================================================
# CI workflow for scripts/powershell/update-windows-server-iso/
# STAGE 1 - Linux checks (psa.py + PSScriptAnalyzer on PowerShell 7.x)
#
# This is the first stage of the Update-WindowsServerIso.ps1 CI chain.
# On success it triggers STAGE 2 (Windows checks) via workflow_run.
#
# PSScriptAnalyzer is run via microsoft/psscriptanalyzer-action (Marketplace),
# which natively produces SARIF output suitable for Code Scanning upload.
#
# Governance: /SPEC.md
# Change history: scripts/powershell/update-windows-server-iso/CHANGELOG.md
# ============================================================================
name: 'scripts/powershell/update-windows-server-iso - STAGE 1: Linux checks'

on:
  push:
    branches: [main]
    paths:
      - 'scripts/powershell/update-windows-server-iso/Update-WindowsServerIso.ps1'
      - 'scripts/powershell/update-windows-server-iso/.psa.config.json'
      - 'scripts/powershell/update-windows-server-iso/PSScriptAnalyzerSettings.psd1'
      - 'scripts/powershell/update-windows-server-iso/data/**'
      - 'scripts/python/powershell-static-analyzer/psa.py'
      - 'scripts/python/powershell-static-analyzer/VERSION'
      - '.github/workflows/scripts__powershell__update-windows-server-iso__stage1__linux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/powershell/update-windows-server-iso/Update-WindowsServerIso.ps1'
      - 'scripts/powershell/update-windows-server-iso/.psa.config.json'
      - 'scripts/powershell/update-windows-server-iso/PSScriptAnalyzerSettings.psd1'
      - 'scripts/powershell/update-windows-server-iso/data/**'
      - 'scripts/python/powershell-static-analyzer/psa.py'
      - 'scripts/python/powershell-static-analyzer/VERSION'
      - '.github/workflows/scripts__powershell__update-windows-server-iso__stage1__linux.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which tool group to run (default: all)'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'psa-only', 'pssa-only']

permissions:
  contents: read
  security-events: write  # for upload-sarif

concurrency:
  group: uwsi-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-checks:
    # Fork PR guard: see /SPEC.md §5 [SPEC-CI-030]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # T2 - Medium (extended): 90 minutes (see /SPEC.md §4 [SPEC-CI-020])
    # Rationale: microsoft/psscriptanalyzer-action installs the
    # PSScriptAnalyzer module from PSGallery (~2-3 min on Linux pwsh 7)
    # plus analysis of a 4000+ LOC PowerShell script (~5-10 min).
    # Buffer for transient PSGallery latency and runner warm-up.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Pin to 3.12 (LTS Python) rather than '3.x' which resolves to
          # the latest available CPython. As of mid-2026 setup-python
          # resolves '3.x' to 3.14.x which has not been validated against
          # psa.py + the T1-T5 self-verification tools. Bump explicitly
          # after running the full test matrix locally on the target
          # Python version.
          python-version: '3.12'

      # --- Pre-flight: runner environment diagnostics ---
      # The ubuntu-latest image is rolled weekly. Recording the Python
      # version, pwsh availability, CWD, and key env vars up front means
      # every failed run carries the data needed to triage runner-side
      # drift without having to re-run the job for diagnosis. Mirrors
      # the Windows-side diagnostic step in STAGE 2.
      - name: '[Diag] Runner environment snapshot'
        run: |
          set +e   # don't let a single missing tool tank the diagnostic step
          echo "===== uname ====="
          uname -a
          echo
          echo "===== Python ====="
          python3 --version
          which python3
          echo
          echo "===== pwsh (PowerShell 7) ====="
          if command -v pwsh > /dev/null 2>&1; then
            pwsh --version
            which pwsh
          else
            echo "pwsh NOT FOUND on this runner"
          fi
          echo
          echo "===== Current working directory ====="
          pwd
          echo
          echo "===== Key environment variables ====="
          for v in GITHUB_WORKSPACE RUNNER_TEMP RUNNER_OS RUNNER_ARCH HOME TMPDIR; do
            echo "  $v = ${!v}"
          done
          echo
          echo "===== Repository top-level layout ====="
          ls -la "$GITHUB_WORKSPACE" | head -20

      # --- Source-file format guard: BOM + CRLF + ASCII only ---
      # See SPEC §A.2 and Part C.2 for the contract. This catches
      # encoding regressions before any analyzer is invoked.
      - name: '[Format] Validate UTF-8 BOM + CRLF + ASCII-only'
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          p = Path('scripts/powershell/update-windows-server-iso/Update-WindowsServerIso.ps1')
          data = p.read_bytes()
          if data[:3] != b'\xef\xbb\xbf':
              print('FAIL: UTF-8 BOM missing (expected EF BB BF)', file=sys.stderr)
              sys.exit(1)
          payload = data[3:]
          if b'\r\n' not in payload[:200]:
              print('FAIL: CRLF line endings not detected', file=sys.stderr)
              sys.exit(1)
          non_ascii = sum(1 for b in payload if b > 0x7F)
          if non_ascii:
              print(f'FAIL: {non_ascii} non-ASCII byte(s) outside the BOM', file=sys.stderr)
              sys.exit(1)
          print(f'OK: BOM + CRLF + ASCII-only ({len(data):,} bytes)')
          PY

      # --- Config JSON parse guard (Schema 2.1+, r05.0+) ---
      # Schema 2.0 (r03) introduced the Common/PatchBaseline/LanguageSpecific
      # hierarchy. Schema 2.1 (r05.0) added the Pca2023 section. The validator
      # below recognises both, requires v2.0 or higher, and warns on the older
      # v2.0 (preserved for back-compat readers).
      - name: '[Format] Validate Config JSON files'
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          d = Path('scripts/powershell/update-windows-server-iso/data')
          required = {'config-Server2016.json', 'config-Server2019.json', 'config-Server2022.json', 'config-Server2025.json'}
          present = {p.name for p in d.glob('config-Server*.json')}
          missing = required - present
          if missing:
              print(f'FAIL: missing OS config files under data/: {sorted(missing)}', file=sys.stderr)
              sys.exit(1)

          # Schema 2.x top-level required keys
          required_top = ('Schema', 'OsKey', 'Common', 'PatchBaseline',
                          'AutoRefreshPolicy', 'LanguageSpecific')
          # Common block required keys (lifted from old v1 top-level keys)
          required_common = ('Build', 'OsShortName', 'Architecture',
                             'SupportedLanguages')
          # Languages we expect every Config to support (both)
          required_langs = ('en-us', 'ja-jp')
          # Schema 2.1+ adds a top-level Pca2023 block (optional in 2.0)
          for f in sorted(d.glob('config-Server*.json')):
              with open(f) as fp:
                  data = json.load(fp)
              schema = str(data.get('Schema', ''))
              if schema not in ('2.0', '2.1'):
                  print(f'FAIL: {f.name} Schema="{schema}" - must be 2.0 or 2.1', file=sys.stderr)
                  sys.exit(1)
              for key in required_top:
                  if key not in data:
                      print(f'FAIL: {f.name} missing top-level "{key}"', file=sys.stderr)
                      sys.exit(1)
              common = data['Common']
              for key in required_common:
                  if key not in common:
                      print(f'FAIL: {f.name} missing Common.{key}', file=sys.stderr)
                      sys.exit(1)
              for lang in required_langs:
                  if lang not in common['SupportedLanguages']:
                      print(f'FAIL: {f.name} Common.SupportedLanguages missing "{lang}"', file=sys.stderr)
                      sys.exit(1)
                  if lang not in data['LanguageSpecific']:
                      print(f'FAIL: {f.name} missing LanguageSpecific.{lang}', file=sys.stderr)
                      sys.exit(1)
              # Pca2023 block (Schema 2.1+) - warn on 2.0, require on 2.1
              if schema == '2.1':
                  if 'Pca2023' not in data:
                      print(f'FAIL: {f.name} Schema 2.1 declared but Pca2023 block missing', file=sys.stderr)
                      sys.exit(1)
                  for key in ('RequiredByDefault', 'RequiredUpdateLevelKb'):
                      if key not in data['Pca2023']:
                          print(f'FAIL: {f.name} Pca2023.{key} missing', file=sys.stderr)
                          sys.exit(1)
              print(f'OK: {f.name} Schema={schema} Build={common["Build"]} langs={common["SupportedLanguages"]}')
          PY

      # --- Tool group: psa.py ---
      # NOTE: psa.py auto-loads .psa.config.json from CWD (implicit config).
      # Running from the project directory enables the psa2010_known_cmdlets
      # list documented in the project-level .psa.config.json. Do not refactor
      # to run from repo root without explicitly passing --config.
      - name: '[psa.py] Run text analysis'
        if: ${{ inputs.scope == 'all' || inputs.scope == 'psa-only' || github.event_name != 'workflow_dispatch' }}
        working-directory: scripts/powershell/update-windows-server-iso
        run: python3 ../../python/powershell-static-analyzer/psa.py Update-WindowsServerIso.ps1 | tee psa.log

      - name: '[psa.py] Generate SARIF'
        if: ${{ inputs.scope == 'all' || inputs.scope == 'psa-only' || github.event_name != 'workflow_dispatch' }}
        working-directory: scripts/powershell/update-windows-server-iso
        run: python3 ../../python/powershell-static-analyzer/psa.py --format sarif Update-WindowsServerIso.ps1 > psa.sarif

      - name: '[psa.py] Upload SARIF to Code Scanning'
        if: ${{ always() && (inputs.scope == 'all' || inputs.scope == 'psa-only' || github.event_name != 'workflow_dispatch') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scripts/powershell/update-windows-server-iso/psa.sarif
          category: psa-py

      # --- Tool group: PSScriptAnalyzer (PowerShell 7.x via Marketplace action) ---
      # The action handles: pwsh setup, PSScriptAnalyzer install, run, SARIF emission.
      # See https://github.com/microsoft/psscriptanalyzer-action for action contract.
      - name: '[PSSA-pwsh7] Run microsoft/psscriptanalyzer-action'
        if: ${{ inputs.scope == 'all' || inputs.scope == 'pssa-only' || github.event_name != 'workflow_dispatch' }}
        id: pssa-linux
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          path: ./scripts/powershell/update-windows-server-iso/Update-WindowsServerIso.ps1
          settings: ./scripts/powershell/update-windows-server-iso/PSScriptAnalyzerSettings.psd1
          recurse: false
          output: pssa.sarif

      - name: '[PSSA-pwsh7] Upload SARIF to Code Scanning'
        if: ${{ always() && (inputs.scope == 'all' || inputs.scope == 'pssa-only' || github.event_name != 'workflow_dispatch') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pssa.sarif
          category: pssa-pwsh7

      - name: '[PSSA-pwsh7] Generate text log from SARIF (for artifact)'
        if: ${{ always() && (inputs.scope == 'all' || inputs.scope == 'pssa-only' || github.event_name != 'workflow_dispatch') }}
        shell: pwsh
        run: |
          if (Test-Path pssa.sarif) {
            $sarif = Get-Content pssa.sarif -Raw | ConvertFrom-Json
            $results = $sarif.runs[0].results
            "PSScriptAnalyzer (pwsh 7) results: $($results.Count) finding(s)" | Out-File pssa.log
            foreach ($r in $results) {
              "[$($r.level)] $($r.ruleId) : $($r.message.text) @ $($r.locations[0].physicalLocation.region.startLine)" | Out-File pssa.log -Append
            }
            Get-Content pssa.log
          } else {
            "pssa.sarif not produced - see action log for failure." | Out-File pssa.log
          }

      # --- Common: Step Summary and artifacts ---
      - name: '[Summary] Write Step Summary'
        if: always()
        run: |
          {
            echo "## STAGE 1 - Linux checks results"
            echo ""
            echo "### psa.py"
            if [ -f scripts/powershell/update-windows-server-iso/psa.log ]; then
              tail -20 scripts/powershell/update-windows-server-iso/psa.log
            fi
            echo ""
            echo "### PSScriptAnalyzer (pwsh 7)"
            if [ -f pssa.log ]; then
              cat pssa.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact content minimization: see /SPEC.md §12 [SPEC-CI-081].
      # The path list below MUST be an explicit file enumeration drawn
      # from the allowlist in /SPEC.md §12.2 (psa.log, psa.sarif,
      # pssa.log, pssa.sarif). Wildcard paths (e.g., 'path: .',
      # 'path: ./**') are forbidden - they would upload the entire
      # checkout including hidden files and potentially secrets.
      - name: '[Artifacts] Upload logs'
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: uwsi-stage1-${{ github.run_id }}
          path: |
            scripts/powershell/update-windows-server-iso/psa.log
            scripts/powershell/update-windows-server-iso/psa.sarif
            pssa.log
            pssa.sarif
          if-no-files-found: warn
          retention-days: 14
