# ============================================================================
# CI workflow for scripts/powershell/update-windows-server-iso/
# STAGE 2 - Windows checks (PSScriptAnalyzer on Windows PowerShell 5.1 +
# read-only smoke modes including -EnvironmentInfoOnly and -Action ListPhases).
#
# Triggered by STAGE 1 success (workflow_run chain, 1 hop).
# PSScriptAnalyzer is run via microsoft/psscriptanalyzer-action on
# Windows PowerShell 5.1 (the action supports both pwsh 7 and Windows PS 5.1).
#
# Governance: /SPEC.md
# Change history: scripts/powershell/update-windows-server-iso/CHANGELOG.md
# ============================================================================
name: 'scripts/powershell/update-windows-server-iso - STAGE 2: Windows checks'

on:
  workflow_run:
    workflows: ['scripts/powershell/update-windows-server-iso - STAGE 1: Linux checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read  # to read upstream workflow_run status

concurrency:
  group: uwsi-stage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    # Run only on STAGE 1 success; Fork PR guard kept for consistency
    # (workflow_run does not fire on fork PR HEAD by default, but we keep
    # the guard to enforce the project-wide invariant from /SPEC.md §5).
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    # T2 - Medium (extended): 120 minutes (see /SPEC.md §4 [SPEC-CI-020])
    # Rationale: Windows runner cold-start is slower (~2 min); PSScriptAnalyzer
    # install on Windows PowerShell 5.1 is slower than on pwsh 7 Linux
    # (~5-8 min); -EnvironmentInfoOnly + -Action ListPhases smoke tests
    # (~1 min combined) plus buffer for transient PSGallery latency.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # --- Tool group: PSScriptAnalyzer (Windows PowerShell 5.1) ---
      # The Marketplace action runs PSScriptAnalyzer; the analyzed script
      # ('Update-WindowsServerIso.ps1') targets Windows PS 5.1 - so the smoke
      # tests below explicitly use 'powershell' shell.
      - name: '[PSSA-pwsh51] Run microsoft/psscriptanalyzer-action'
        id: pssa-windows
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          path: ./scripts/powershell/update-windows-server-iso/Update-WindowsServerIso.ps1
          settings: ./scripts/powershell/update-windows-server-iso/PSScriptAnalyzerSettings.psd1
          recurse: false
          output: pssa.sarif

      - name: '[PSSA-pwsh51] Upload SARIF to Code Scanning'
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pssa.sarif
          category: pssa-pwsh51

      - name: '[PSSA-pwsh51] Generate text log from SARIF (for artifact)'
        if: always()
        shell: pwsh
        run: |
          if (Test-Path pssa.sarif) {
            $sarif = Get-Content pssa.sarif -Raw | ConvertFrom-Json
            $results = $sarif.runs[0].results
            "PSScriptAnalyzer (Windows PS 5.1) results: $($results.Count) finding(s)" | Out-File pssa.log
            foreach ($r in $results) {
              "[$($r.level)] $($r.ruleId) : $($r.message.text) @ $($r.locations[0].physicalLocation.region.startLine)" | Out-File pssa.log -Append
            }
            Get-Content pssa.log
          } else {
            "pssa.sarif not produced - see action log for failure." | Out-File pssa.log
          }

      # --- Parse-only check (Windows PowerShell 5.1) ---
      # Confirms the AST parses cleanly under the target runtime. Many
      # PS 7-only syntactic constructs (ternary, ?., ?:) would fail here
      # but not on Linux pwsh 7.
      - name: '[Parse-pwsh51] AST parse-only check'
        shell: powershell
        working-directory: scripts/powershell/update-windows-server-iso
        run: |
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\Update-WindowsServerIso.ps1).Path,
              [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
              $errors | Format-Table -AutoSize
              Write-Error ("Parser found $($errors.Count) error(s) under Windows PowerShell 5.1")
              exit 1
          }
          Write-Host ("Parser OK: $($tokens.Count) tokens, no errors.")

      # --- Smoke test 1: -Action ListPhases (no side effects) ---
      - name: '[Smoke1] -Action ListPhases'
        shell: powershell
        timeout-minutes: 2
        working-directory: scripts/powershell/update-windows-server-iso
        run: |
          .\Update-WindowsServerIso.ps1 -Action ListPhases
          if ($LASTEXITCODE -ne 0) {
              Write-Error "ListPhases smoke test failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      # --- Smoke test 2: -EnvironmentInfoOnly ---
      # Dumps PowerShell runtime info via Show-PowerShellEnvironment and exits 0.
      # Matches the canonical Phase 1 Step 0 smoke pattern used across this repo.
      - name: '[Smoke2] -EnvironmentInfoOnly'
        shell: powershell
        timeout-minutes: 5
        working-directory: scripts/powershell/update-windows-server-iso
        run: |
          .\Update-WindowsServerIso.ps1 -EnvironmentInfoOnly -WorkRoot 'C:\Temp\Workspace_UpdateWsi_CI'
          if ($LASTEXITCODE -ne 0) {
              Write-Error "EnvironmentInfoOnly smoke test failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      # --- Smoke test 3: Synthetic + DryRun (no DISM writes) ---
      # Exercises the registry-driven dispatcher and the P02/P03/P04
      # planning paths without mounting any WIM.
      - name: '[Smoke3] Synthetic + DryRun'
        shell: powershell
        timeout-minutes: 5
        working-directory: scripts/powershell/update-windows-server-iso
        run: |
          .\Update-WindowsServerIso.ps1 `
              -Action PrepareBuildVerify `
              -OsVersion Server2019 -OsLanguage en-us `
              -SyntheticTestMode -DryRun -SkipEnvCheck `
              -WorkRoot 'C:\Temp\Workspace_UpdateWsi_CI'
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Synthetic+DryRun smoke test failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: '[Summary] Write Step Summary'
        if: always()
        shell: pwsh
        run: |
          "## STAGE 2 - Windows checks results" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "### PSScriptAnalyzer (Windows PS 5.1)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path pssa.log) { Get-Content pssa.log | Out-File $env:GITHUB_STEP_SUMMARY -Append }
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "### Smoke tests" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- ListPhases: see job log" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- EnvironmentInfoOnly: see job log" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Synthetic + DryRun: see job log" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # Artifact content minimization: see /SPEC.md §12 [SPEC-CI-081].
      # The path list below MUST be an explicit file enumeration drawn
      # from the allowlist in /SPEC.md §12.2 (pssa.log, pssa.sarif).
      # Wildcard paths (e.g., 'path: .', 'path: ./**') are forbidden -
      # they would upload the entire checkout including hidden files
      # and potentially secrets.
      - name: '[Artifacts] Upload logs'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwsi-stage2-${{ github.run_id }}
          path: |
            pssa.log
            pssa.sarif
          if-no-files-found: warn
          retention-days: 14
